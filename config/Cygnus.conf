# Generated helper config for the official Cygnus-S path.
# Copy this to config/Cygnus.conf if your Cygnus-S build accepts a user conf.

# Keep AutoMouse active for 10 seconds after the last trackball movement.
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=10000

# Use a mild precision pointer speed when a snipe layer is active.
CONFIG_PMW3610_SNIPE_CPI=800
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1
