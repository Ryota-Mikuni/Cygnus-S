description: Cygnus trackball gesture key behavior

compatible: "zmk,behavior-cygnus-gesture"

include: one_param.yaml

properties:
  threshold:
    type: int
    default: 70
  ratio-numerator:
    type: int
    default: 13
  ratio-denominator:
    type: int
    default: 10
  win-layer:
    type: int
    required: true
  bindings:
    type: phandle-array
    required: true
