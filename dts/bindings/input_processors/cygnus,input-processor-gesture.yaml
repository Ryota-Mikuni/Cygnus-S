description: Cygnus trackball gesture input processor

compatible: "cygnus,input-processor-gesture"

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 0
  track-remainders:
    type: boolean
  tick:
    type: int
    default: 18
  wait-ms:
    type: int
    default: 20
  tap-ms:
    type: int
    default: 20
  bindings:
    type: phandle-array
    required: true
