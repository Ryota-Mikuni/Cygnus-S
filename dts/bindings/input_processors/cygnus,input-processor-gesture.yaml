description: Cygnus trackball gesture input processor

compatible: "cygnus,input-processor-gesture"

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 0
  threshold:
    type: int
    default: 18
  ratio-numerator:
    type: int
    default: 13
  ratio-denominator:
    type: int
    default: 10
  tap-ms:
    type: int
    default: 20
  win-layer:
    type: int
    required: true
  automouse-layer:
    type: int
    required: true
  win-automouse-layer:
    type: int
    required: true
  n-position:
    type: int
    required: true
  r-position:
    type: int
    required: true
  d-position:
    type: int
    required: true
  m-position:
    type: int
    required: true
  d-mac-bindings:
    type: phandle-array
    required: true
  d-win-bindings:
    type: phandle-array
    required: true
  m-mac-bindings:
    type: phandle-array
    required: true
  m-win-bindings:
    type: phandle-array
    required: true
  r-mac-bindings:
    type: phandle-array
    required: true
  r-win-bindings:
    type: phandle-array
    required: true
