description: Cygnus directional trackball gesture input processor

compatible: "cygnus,input-processor-gesture"

include: ip_zero_param.yaml

properties:
  track-remainders:
    type: boolean
    required: false

  tick:
    type: int
    required: false
    default: 40
    description: Relative movement threshold required to trigger a gesture.

  wait-ms:
    type: int
    required: false
    default: 300
    description: Minimum interval between gesture triggers.

  tap-ms:
    type: int
    required: false
    default: 20
    description: Press duration used when tapping the selected behavior binding.

  bindings:
    type: phandle-array
    required: true
    description: Four behavior bindings in right, left, up, down order.
